<script>
    // Banco de 80 preguntas estrictamente ceñidas al temario de análisis de circuitos
    const questionBank = [
        // --- DC Y TEOREMAS (15) ---
        { text: "El principio de superposición establece que la potencia total disipada en una resistencia es igual a la suma algebraica de las potencias calculadas para cada fuente actuando de forma independiente.", answer: false, explanation: "FALSO. La superposición es válida para relaciones lineales (voltaje y corriente), pero la potencia es una función cuadrática ($P = I^2R$). No se pueden sumar las potencias individuales directamente." },
        { text: "Al aplicar el teorema de Thévenin, para hallar la resistencia equivalente $R_{th}$, las fuentes de voltaje independientes se reemplazan por cortocircuitos y las de corriente por circuitos abiertos.", answer: true, explanation: "VERDADERO. Hacer una fuente cero significa $V=0$ (cortocircuito) o $I=0$ (circuito abierto)." },
        { text: "Las fuentes dependientes (controladas) deben apagarse al igual que las independientes cuando se calcula la resistencia de Thévenin $R_{th}$ mediante reducción serie-paralelo.", answer: false, explanation: "FALSO. Las fuentes dependientes NUNCA se apagan. Si existen, no se puede usar serie-paralelo; se debe inyectar una fuente de prueba $V_{test}$ o usar $R_{th} = \\frac{V_{oc}}{I_{sc}}$." },
        { text: "En un análisis de mallas, una 'supermalla' se crea cuando una fuente de corriente se encuentra compartida entre dos mallas adyacentes.", answer: true, explanation: "VERDADERO. Dado que no conocemos el voltaje a través de la fuente de corriente, combinamos ambas mallas evadiendo la rama de la fuente y luego planteamos la ecuación de restricción." },
        { text: "Un nodo de referencia (tierra) en el análisis nodal siempre debe conectarse a la terminal negativa de una fuente de voltaje para que los cálculos sean válidos.", answer: false, explanation: "FALSO. El nodo de referencia puede elegirse arbitrariamente en cualquier parte del circuito. La elección inteligente (donde más ramas se unen) solo simplifica las ecuaciones." },
        { text: "En DC, la máxima transferencia de potencia a una resistencia de carga $R_L$ ocurre cuando $R_L$ es exactamente igual a la resistencia de Thévenin $R_{th}$.", answer: true, explanation: "VERDADERO. Se demuestra maximizando la ecuación de potencia: derivando $P$ respecto a $R_L$ e igualando a cero se obtiene $R_L = R_{th}$." },
        { text: "El equivalente de Norton consiste en una fuente de corriente $I_N$ en serie con una resistencia $R_N$.", answer: false, explanation: "FALSO. El teorema de Norton establece que la red se reemplaza por una fuente de corriente en **paralelo** con la resistencia $R_N$." },
        { text: "La conductancia $G$ equivalente de resistores en paralelo se calcula sumando las conductancias individuales: $G_{eq} = G_1 + G_2 + \\dots + G_n$.", answer: true, explanation: "VERDADERO. Ya que $G = \\frac{1}{R}$, y en paralelo $\\frac{1}{R_{eq}} = \\sum \\frac{1}{R_i}$, entonces $G_{eq} = \\sum G_i$." },
        { text: "Las transformaciones de Delta ($\\Delta$) a Estrella ($Y$) solo son aplicables si las tres resistencias tienen exactamente el mismo valor (redes balanceadas).", answer: false, explanation: "FALSO. Las ecuaciones de transformación $\\Delta-Y$ (por ejemplo $R_a = \\frac{R_1 R_2}{R_1+R_2+R_3}$) aplican para cualquier valor de resistencias, balanceadas o no." },
        { text: "La suma algebraica de todos los voltajes alrededor de cualquier lazo cerrado en un circuito es siempre igual a cero, de acuerdo con la Ley de Voltajes de Kirchhoff (LVK).", answer: true, explanation: "VERDADERO. La LVK es una consecuencia directa del principio de conservación de la energía." },
        
        // --- TRANSITORIOS (RL, RC, RLC Y ESCALÓN UNITARIO) (20) ---
        { text: "En un circuito RC excitado por una función escalón unitario, el voltaje en el capacitor no puede sufrir cambios instantáneos, por lo que $v_c(0^-) = v_c(0^+)$.", answer: true, explanation: "VERDADERO. Un cambio instantáneo de voltaje requeriría una corriente infinita ($i = C\\frac{dv}{dt}$), lo cual es físicamente imposible." },
        { text: "En un circuito RL, la corriente a través del inductor se ajusta instantáneamente a los cambios en el voltaje de la fuente externa.", answer: false, explanation: "FALSO. El inductor se opone a los cambios bruscos de corriente ($v = L\\frac{di}{dt}$). Por tanto, $i_L(0^-) = i_L(0^+)$." },
        { text: "La constante de tiempo $\\tau$ para un circuito RL de primer orden se calcula como $\\tau = \\frac{L}{R}$ y tiene unidades de segundos.", answer: true, explanation: "VERDADERO. Esta relación define la rapidez con la que el circuito decae; a los $5\\tau$, el transitorio se considera extinto." },
        { text: "Para la respuesta completa de un circuito de primer orden, la ecuación general es: $x(t) = x(\\infty) + [x(0) - x(\\infty)]e^{-t/\\tau}$.", answer: true, explanation: "VERDADERO. Esta es la forma estándar donde $x(\\infty)$ es la respuesta forzada (estado estable) y el término exponencial es la respuesta natural." },
        { text: "En $t = \\infty$ (estado estacionario DC), un inductor ideal se comporta como un circuito abierto y un capacitor ideal como un cortocircuito.", answer: false, explanation: "FALSO. Es exactamente al revés. En DC ($f=0$), la derivada es cero. Así, el capacitor se abre ($i=0$) y el inductor se cortocircuita ($v=0$)." },
        { text: "En un circuito RLC serie sin fuente, la ecuación característica es de segundo orden y adopta la forma $s^2 + \\frac{R}{L}s + \\frac{1}{LC} = 0$.", answer: true, explanation: "VERDADERO. Se obtiene al aplicar LVK: $L\\frac{di}{dt} + Ri + \\frac{1}{C}\\int i dt = 0$, y derivando respecto al tiempo." },
        { text: "Un circuito RLC se clasifica como 'críticamente amortiguado' si el coeficiente de amortiguamiento $\\alpha$ es estrictamente mayor que la frecuencia de resonancia $\\omega_0$.", answer: false, explanation: "FALSO. Si $\\alpha > \\omega_0$, es **sobreamortiguado** (raíces reales y distintas). Es **críticamente amortiguado** solo si $\\alpha = \\omega_0$ (raíces reales iguales)." },
        { text: "En la respuesta subamortiguada de un circuito RLC, las raíces de la ecuación característica son números complejos conjugados del tipo $s_{1,2} = -\\alpha \\pm j\\omega_d$.", answer: true, explanation: "VERDADERO. Esto ocurre cuando $\\alpha < \\omega_0$. La respuesta en el tiempo consiste en senoides que decaen exponencialmente." },
        { text: "Para evaluar la derivada del voltaje inicial en un capacitor $\\frac{dv_c(0^+)}{dt}$ en un circuito de 2do orden, se debe utilizar la LCK en el nodo del capacitor en $t=0^+$.", answer: true, explanation: "VERDADERO. Sabiendo que $i_c(0^+) = C\\frac{dv_c(0^+)}{dt}$, al hallar la corriente inicial del capacitor mediante las leyes de Kirchhoff, se puede despejar la derivada." },
        { text: "La energía inicial almacenada en un circuito RLC paralelo siempre debe ser cero antes de que se active una fuente escalón en $t=0$.", answer: false, explanation: "FALSO. Un circuito puede tener energía almacenada previamente en sus inductores ($I_0$) y capacitores ($V_0$). Las condiciones iniciales dependen de la historia del circuito para $t < 0$." },

        // --- FASORES Y ESTADO ESTABLE AC (15) ---
        { text: "El uso de fasores permite transformar ecuaciones diferenciales lineales con coeficientes constantes en ecuaciones algebraicas con números complejos.", answer: true, explanation: "VERDADERO. El operador derivada $\\frac{d}{dt}$ se sustituye por la multiplicación por $j\\omega$, simplificando drásticamente el análisis de circuitos AC en estado estable." },
        { text: "Si un voltaje es $v(t) = 10 \\sin(\\omega t + 30^\\circ)$, su representación fasorial estándar (asumiendo referencia coseno) es $\\mathbf{V} = 10 \\angle 30^\\circ$.", answer: false, explanation: "FALSO. Si se usa el coseno como referencia, $\\sin(x) = \\cos(x - 90^\\circ)$. Por lo tanto, el fasor correcto sería $\\mathbf{V} = 10 \\angle -60^\\circ$." },
        { text: "La impedancia de un capacitor ideal está dada por $\\mathbf{Z}_c = -j\\frac{1}{\\omega C}$, lo cual indica que la corriente adelanta al voltaje en $90^\\circ$.", answer: true, explanation: "VERDADERO. En forma polar, el $-j$ representa un ángulo de $-90^\\circ$ para la impedancia. Por ley de Ohm $\\mathbf{I} = \\frac{\\mathbf{V}}{\\mathbf{Z}_c}$, resultando en un adelanto de corriente." },
        { text: "La admitancia $\\mathbf{Y}$ es el inverso complejo de la impedancia $\\mathbf{Z}$. Por lo tanto, la conductancia $G$ siempre es igual a $\\frac{1}{R}$, incluso si hay reactancias presentes.", answer: false, explanation: "FALSO. Si $\\mathbf{Z} = R + jX$, entonces $\\mathbf{Y} = \\frac{1}{R + jX}$. Al racionalizar, la parte real es $G = \\frac{R}{R^2 + X^2}$, lo cual es diferente de $\\frac{1}{R}$ si $X \\neq 0$." },
        { text: "Las Leyes de Kirchhoff y los teoremas de redes (Nodos, Mallas, Thévenin) se aplican exactamente igual en el dominio fasorial que en circuitos puramente resistivos de DC.", answer: true, explanation: "VERDADERO. La linealidad se mantiene. La única diferencia matemática es que las variables ahora son vectores (fasores) y los elementos son impedancias complejas." },
        { text: "La magnitud de la suma de dos fasores $\\mathbf{V}_1 = 10\\angle 0^\\circ$ y $\\mathbf{V}_2 = 10\\angle 180^\\circ$ es $20\\text{ V}$.", answer: false, explanation: "FALSO. Al estar desfasados $180^\\circ$ (en contrafase), se restan destructivamente. La magnitud resultante es $0\\text{ V}$." },
        { text: "En un inductor ideal, al aumentar la frecuencia angular $\\omega$, la magnitud de su impedancia ($|\\mathbf{Z}_L|$) aumenta proporcionalmente.", answer: true, explanation: "VERDADERO. Como $|\\mathbf{Z}_L| = \\omega L$, la relación es directamente proporcional. El inductor actúa como circuito abierto a muy altas frecuencias." },

        // --- POTENCIA AC Y FACTOR DE POTENCIA (15) ---
        { text: "El valor RMS (Raíz Cuadrática Media) de una onda senoidal es el valor que entregaría la misma potencia promedio a un resistor que una fuente de DC de ese mismo valor.", answer: true, explanation: "VERDADERO. Esta es la definición de equivalencia calórica o térmica del valor efectivo RMS." },
        { text: "Para una forma de onda periódica genérica, el valor RMS siempre se calcula dividiendo su valor pico entre $\\sqrt{2}$.", answer: false, explanation: "FALSO. La fórmula $V_{rms} = \\frac{V_p}{\\sqrt{2}}$ aplica **exclusivamente** a ondas senoidales perfectas. Para otras ondas (como cuadradas o triangulares) se debe usar la integral de la definición RMS." },
        { text: "La Potencia Aparente $S$, medida en Volt-Amperios (VA), es simplemente la suma algebraica de la potencia activa $P$ y la potencia reactiva $Q$ ($S = P + Q$).", answer: false, explanation: "FALSO. La potencia aparente es la magnitud de la potencia compleja, y se suma vectorialmente: $S = \\sqrt{P^2 + Q^2}$." },
        { text: "La potencia activa (promedio) disipada en un inductor ideal es siempre igual a cero.", answer: true, explanation: "VERDADERO. Un inductor ideal (sin resistencia parasítica) solo absorbe y devuelve energía a la fuente; su ángulo de fase de $90^\\circ$ hace que el factor de potencia sea $\\cos(90^\\circ) = 0$." },
        { text: "La potencia compleja absorbida por una carga se calcula como $\\mathbf{S} = \\mathbf{V}_{rms} \\mathbf{I}_{rms}$, multiplicando ambos fasores directamente.", answer: false, explanation: "FALSO. Para preservar la diferencia de fase correcta ($\\theta_v - \\theta_i$), la fórmula correcta requiere el complejo conjugado de la corriente: $\\mathbf{S} = \\mathbf{V}_{rms} \\mathbf{I}^*_{rms}$." },
        { text: "Un Factor de Potencia (FP) en 'atraso' (lagging) significa que la corriente está retrasada respecto al voltaje, lo cual es indicativo de una carga predominantemente inductiva.", answer: true, explanation: "VERDADERO. En cargas como motores y transformadores, el campo magnético causa que la corriente alcance sus picos después que el voltaje." },
        { text: "Para corregir el factor de potencia de una carga industrial inductiva y llevarlo a 1, se debe conectar un banco de capacitores en serie con la carga.", answer: false, explanation: "FALSO. Los capacitores de corrección se conectan en **paralelo** con la carga, de modo que el voltaje de operación original del equipo no se vea alterado." },
        { text: "Para garantizar la máxima transferencia de potencia activa a una carga en un circuito AC, la impedancia de carga $\\mathbf{Z}_L$ debe ser el conjugado complejo de la impedancia de Thévenin: $\\mathbf{Z}_L = \\mathbf{Z}_{th}^*$.", answer: true, explanation: "VERDADERO. Si $\\mathbf{Z}_{th} = R_{th} + jX_{th}$, una carga $\\mathbf{Z}_L = R_{th} - jX_{th}$ cancela completamente la reactancia y maximiza la transferencia hacia $R_{th}$." },

        // --- SISTEMAS TRIFÁSICOS (7) ---
        { text: "En un sistema trifásico balanceado conectado en Estrella (Y), el voltaje de línea $V_L$ es $\\sqrt{3}$ veces mayor que el voltaje de fase $V_f$.", answer: true, explanation: "VERDADERO. Por la resta fasorial de dos voltajes de fase desfasados $120^\\circ$, la magnitud del voltaje entre líneas es $V_L = \\sqrt{3} V_f$." },
        { text: "En un sistema conectado en Delta ($\\Delta$) balanceado, la corriente de fase es igual a la corriente de línea.", answer: false, explanation: "FALSO. En un sistema Delta, los voltajes son iguales ($V_L = V_f$), pero las corrientes difieren; la corriente de línea es $I_L = \\sqrt{3} I_f$." },
        { text: "La potencia activa total $P$ entregada a una carga trifásica balanceada puede calcularse como $P = \\sqrt{3} V_L I_L \\cos(\\theta)$, sin importar si está conectada en estrella o en delta.", answer: true, explanation: "VERDADERO. Esta fórmula universal que usa variables de línea es independiente de la topología (Y o $\\Delta$) siempre que el sistema esté balanceado." },
        { text: "En un sistema trifásico balanceado de cuatro hilos, la corriente que fluye a través del conductor neutro es igual a cero.", answer: true, explanation: "VERDADERO. Al aplicar LCK en el nodo neutro, la suma vectorial de las tres corrientes desfasadas $120^\\circ$ es matemáticamente cero." },

        // --- RESPUESTA EN FRECUENCIA, BODE Y FUNCIONES DE TRANSFERENCIA (8) ---
        { text: "Una Función de Transferencia $\\mathbf{H}(s)$ se define como la relación entre la transformada de Laplace de la salida y la entrada, asumiendo que todas las condiciones iniciales son cero.", answer: true, explanation: "VERDADERO. Esta es la definición formal; es una propiedad intrínseca del sistema y no depende de la señal de excitación ni de la energía previa almacenada." },
        { text: "Las raíces del numerador de una función de transferencia $\\mathbf{H}(s)$ se conocen como los 'polos' del sistema.", answer: false, explanation: "FALSO. Las raíces del numerador son los **ceros** (hacen que la respuesta sea nula). Las raíces del denominador son los **polos** (hacen que la función tienda a infinito)." },
        { text: "En un diagrama de Bode de magnitud asintótico, un polo simple introduce una pendiente negativa constante de $-20\\text{ dB/década}$ a partir de su frecuencia de esquina o de corte.", answer: true, explanation: "VERDADERO. A frecuencias superiores a su polo, el término $(1 + j\\frac{\\omega}{\\omega_p})^{-1}$ decae logarítmicamente a una tasa de $20\\text{ dB}$ por cada factor de 10 en la frecuencia." },
        { text: "La frecuencia de resonancia $\\omega_0$ de un circuito tanque RLC ocurre cuando las magnitudes de las potencias activas disipadas por $L$ y $C$ son iguales.", answer: false, explanation: "FALSO. La resonancia ocurre cuando las **reactancias** inductiva y capacitiva se cancelan ($X_L = X_C$), haciendo el circuito puramente resistivo. Ni $L$ ni $C$ disipan potencia activa." },
        { text: "El ancho de banda (BW) de un circuito resonante está determinado por la relación entre su frecuencia de resonancia $\\omega_0$ y su factor de calidad $Q$, dado por $\\text{BW} = \\frac{\\omega_0}{Q}$.", answer: true, explanation: "VERDADERO. A mayor factor de calidad $Q$, el circuito disipa menos energía por ciclo, resultando en un pico de resonancia mucho más agudo y un ancho de banda estrecho." },
        { text: "Para un filtro paso bajo, la frecuencia de corte (frecuencia de media potencia) ocurre cuando la magnitud del voltaje de salida decae a la mitad de su valor máximo.", answer: false, explanation: "FALSO. En la frecuencia de corte, la **potencia** cae a la mitad. El voltaje decae a $\\frac{1}{\\sqrt{2}}$ o aproximadamente al $70.7\\%$ de su valor original ($-3\\text{ dB}$)." },
        { text: "En un circuito RLC serie, en la frecuencia exacta de resonancia, el voltaje a través del inductor y el capacitor es cero.", answer: false, explanation: "FALSO. Sus voltajes son iguales en magnitud y opuestos en fase, anulándose para la LVK total, pero cada elemento individualmente puede tener voltajes extremadamente altos (multiplicados por $Q$)." },
        { text: "La ganancia en decibelios referenciada a voltaje se calcula utilizando la fórmula $G_{dB} = 10 \\log_{10}\\left(\\frac{V_{out}}{V_{in}}\\right)$.", answer: false, explanation: "FALSO. Dado que la potencia es proporcional al cuadrado del voltaje ($V^2/R$), el cuadrado pasa a multiplicar el logaritmo. La fórmula correcta para voltaje es $20 \\log_{10}\\left(\\frac{V_{out}}{V_{in}}\\right)$." }
    ];

    // Algoritmo Fisher-Yates para barajar el banco completo
    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // Inicializar variables del examen
    let currentQuestion = 0;
    let score = 0;
    let randomizedQuestions = [];

    // Referencias del DOM
    const questionText = document.getElementById('question-text');
    const answerButtons = document.getElementById('answer-buttons');
    const feedbackBox = document.getElementById('feedback-box');
    const nextBtn = document.getElementById('next-btn');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const quizSection = document.getElementById('quiz-section');
    const scoreSection = document.getElementById('score-section');

    // Función asíncrona para cargar preguntas y renderizar LaTeX
    async function loadQuestion() {
        feedbackBox.style.display = 'none';
        nextBtn.style.display = 'none';
        answerButtons.style.display = 'flex';
        
        const total = randomizedQuestions.length;
        const progressPercentage = (currentQuestion / total) * 100;
        progressFill.style.width = `${progressPercentage}%`;
        progressText.innerText = `Pregunta ${currentQuestion + 1} de ${total}`;
        
        // Inyectar el texto
        questionText.innerHTML = randomizedQuestions[currentQuestion].text;
        
        // Ejecutar motor MathJax para renderizar la nueva ecuación
        if (window.MathJax) {
            await MathJax.typesetPromise([questionText]);
        }
    }

    async function checkAnswer(userAnswer) {
        answerButtons.style.display = 'none';
        const isCorrect = userAnswer === randomizedQuestions[currentQuestion].answer;
        
        feedbackBox.style.display = 'block';
        if (isCorrect) {
            score++;
            feedbackBox.className = 'feedback correct';
            feedbackBox.innerHTML = `<strong>¡Cálculo exacto!</strong><br><br>${randomizedQuestions[currentQuestion].explanation}`;
        } else {
            feedbackBox.className = 'feedback incorrect';
            feedbackBox.innerHTML = `<strong>Error analítico. Revisemos la teoría:</strong><br><br>${randomizedQuestions[currentQuestion].explanation}`;
        }

        // Renderizar ecuaciones de la retroalimentación
        if (window.MathJax) {
            await MathJax.typesetPromise([feedbackBox]);
        }
        
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < randomizedQuestions.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        quizSection.style.display = 'none';
        scoreSection.style.display = 'flex';
        
        const total = randomizedQuestions.length;
        document.getElementById('final-score').innerText = `${score} / ${total}`;
        
        let msg = "";
        const percentage = (score / total) * 100;
        
        if (percentage >= 90) {
            msg = "¡INGENIERO DE REDES EXCEPCIONAL! \nTienes un dominio absoluto de los teoremas, variables de estado y fasores. Ese parcial será muy fácil para ti.";
        } else if (percentage >= 70) {
            msg = "Aprobado firme. \nComprendes muy bien los fenómenos topológicos y transitorios, pero ten cuidado con los desfases y la potencia compleja en AC.";
        } else if (percentage >= 50) {
            msg = "Conceptos mezclados. \nCuidado, la relación entre las raíces (polos) y la respuesta en el tiempo te puede estar confundiendo. Repasa las ecuaciones de 2do orden.";
        } else {
            msg = "¡Alarma roja para el parcial! \nDebes repasar las Leyes de Kirchhoff y topología básica antes de enfrentar las ecuaciones diferenciales o los fasores.";
        }
        document.getElementById('final-message').innerText = msg;
    }

    // Arrancar el simulador al cargar la página
    window.onload = () => {
        // Barajar banco de preguntas estrictamente acotadas
        randomizedQuestions = shuffleArray([...questionBank]);
        loadQuestion();
    };
</script>

</body>
</html>
